<!DOCTYPE html>

<style>
:root{--ink:#1A1A1A;--paper:#FAF8F4;--accent:#C5312F;--slate:#4A5568;--muted:#8B8680;--border:#D8D3CA}

a.btn:hover{background:#A32623}
.fine{font-size:11px;color:var(--muted);margin-top:26px;font-family:'Instrument Serif',Georgia,serif;font-style:italic}
</style>
</head>
